tools:
  - class_name: "internbootcamp.bootcamps.music_bootcamp.music_tools.ParallelIntervalDetectorTool"
    config:
      type: "native"
    tool_schema:
      type: "function"
      function:
        name: "detect_parallel_intervals"
        description: "分析给定的四部和声序列，自动检测并报告所有平行五度和平行八度的位置。"
        parameters:
          type: "object"
          properties:
            current_data:
              type: "array"
              description: "当前的四部和声数据列表。格式示例：[{'Soprano': 'C5', 'Alto': 'G4', 'Tenor': 'E4', 'Bass': 'C3'}, {'Soprano': 'B4', 'Alto': 'G4', 'Tenor': 'D4', 'Bass': 'G2'}]"
              items:
                type: "object"
                properties:
                  Soprano:
                    type: "string"
                    description: "女高音声部的音符，例如 'C5'"
                  Alto:
                    type: "string"
                    description: "女低音声部的音符，例如 'G4'"
                  Tenor:
                    type: "string"
                    description: "男高音声部的音符，例如 'E4'"
                  Bass:
                    type: "string"
                    description: "男低音声部的音符，例如 'C3'"
          required:
            - "current_data"
