# ============================================================
# Music Harmony Debugger Instruction Generator Configuration
# ============================================================

instruction_generators:
  basic:
    config:
      # --- 1. 声部音域设置 (Voice Ranges) ---
      ranges:
        Soprano: [60, 81]    # C4 - A5
        Alto: [55, 74]       # G3 - D5
        Tenor: [48, 67]      # C3 - G4
        Bass: [40, 60]       # E2 - C4
      
      # --- 2. 调性根音列表 (Key Roots) ---
      roots:
        - C
        - G
        - D
        - A
        - E
        - B
        - "F#"
        - F
        - "B-"
        - "E-"
        - "A-"
      
      # --- 3. 和声进行类型及权重 (Progression Types & Weights) ---
      progression_types:
        - ["V", "I"]
        - ["IV", "I"]
        - ["V", "vi"]
        - ["i", "V"]
      progression_weights: [0.5, 0.2, 0.1, 0.2]
      
      # --- 4. 搜索空间限制 (Search Space Limits) ---
      max_v1_candidates: 30       # 第一个和弦的候选数量上限
      max_v2_candidates: 100      # 第二个和弦的候选数量上限

    # 外部工具配置文件路径
    tool_config_path: "internbootcamp/bootcamps/music_bootcamp/configs/music_tool_config.yaml"
    interaction_config_path: "internbootcamp/bootcamps/music_bootcamp/configs/music_interaction_config.yaml"
    generation_ratio: 1.0

# --- 全局系统配置 ---
global_config:
  class_name: "internbootcamp.bootcamps.music_bootcamp.music_instruction_generator.MusicInstructionGenerator"
  enable_random_seed: true
  default_seed: 42
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: true
