# Maximum Clique Problem Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_vertices: [8, 12]
      clique_size: [3, 4]
      noise: 0.1
  medium:
    config:
      difficulty: "medium"
      num_vertices: [15, 20]
      clique_size: [4, 5]
      noise: 0.15
  hard:
    config:
      difficulty: "hard"
      num_vertices: [25, 30]
      clique_size: [5, 6]
      noise: 0.2
  bench:
    config:
      difficulty: "bench"
      num_vertices: [35, 40]
      clique_size: [6, 7]
      noise: 0.25

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.maximum_clique_problem.instruction_generator.NpMaximumCliqueProblemInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
