# Subset Sum Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      total_numbers_range: [5, 10]
      solution_size_range: [4, 8]
      value_range: [1, 5]
  medium:
    config:
      difficulty: "medium"
      total_numbers_range: [8, 12]
      solution_size_range: [4, 8]
      value_range: [1, 10]
  hard:
    config:
      difficulty: "hard"
      total_numbers_range: [12, 15]
      solution_size_range: [8, 12]
      value_range: [1, 15]
  bench:
    config:
      difficulty: "bench"
      num_elements_range: [30, 40]
      num_subsets_range: [20, 30]
      subset_size_factor: 0.4

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.subset_sum.instruction_generator.NpSubsetSumInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
