# Set Cover Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_elements_range: [10, 20]
      num_subsets_range: [5, 10]
      subset_size_factor: 0.4
  medium:
    config:
      difficulty: "medium"
      num_elements_range: [20, 25]
      num_subsets_range: [10, 15]
      subset_size_factor: 0.4
  hard:
    config:
      difficulty: "hard"
      num_elements_range: [25, 30]
      num_subsets_range: [15, 25]
      subset_size_factor: 0.4
  bench:
    config:
      difficulty: "bench"
      num_elements_range: [30, 40]
      num_subsets_range: [20, 30]
      subset_size_factor: 0.4

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.set_cover.instruction_generator.NpSetCoverInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
