# Minimum Cut Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_nodes: 10
      intra_density: 0.7
      inter_edges: 2
  medium:
    config:
      difficulty: "medium"
      num_nodes: 14
      intra_density: 0.6
      inter_edges: 4
  hard:
    config:
      difficulty: "hard"
      num_nodes: 18
      intra_density: 0.5
      inter_edges: 6
  bench:
    config:
      difficulty: "bench"
      num_nodes: 22
      intra_density: 0.5
      inter_edges: 8

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.minimum_cut.instruction_generator.NpMinimumCutInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
