# Example Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_vertices: [8, 12]
      num_colors: [3, 4]
      edge_density: 0.2
  medium:
    config:
      difficulty: "medium"
      num_vertices: [15, 22]
      num_colors: [4, 6]
      edge_density: 0.35
  hard:
    config:
      difficulty: "hard"
      num_vertices: [25, 32]
      num_colors: [6, 8]
      edge_density: 0.5
  bench:
    config:
      difficulty: "bench"
      num_vertices: [32, 40]
      num_colors: [6, 8]
      edge_density: 0.5
# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.GCP_D.instruction_generator.NpGcpDInstructionGenerator"
  # 是否启用随机种子
  enable_random_seed: true
  
  # 默认种子值
  default_seed: 999
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true