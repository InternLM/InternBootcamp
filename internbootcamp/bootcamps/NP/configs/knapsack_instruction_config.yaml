# Knapsack Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_items: [10, 15]
      weight_range: [5, 30]
      value_ratio: [1.5, 2.5]
      capacity_factor: 0.5
  medium:
    config:
      difficulty: "medium"
      num_items: [15, 25]
      weight_range: [10, 50]
      value_ratio: [1.2, 2.0]
      capacity_factor: 0.4
  hard:
    config:
      difficulty: "hard"
      num_items: [25, 35]
      weight_range: [20, 80]
      value_ratio: [1.0, 1.5]
      capacity_factor: 0.3
  bench:
    config:
      difficulty: "bench"
      num_items: [40, 50]
      weight_range: [30, 100]
      value_ratio: [0.9, 1.3]
      capacity_factor: 0.25

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.knapsack.instruction_generator.NpKnapsackInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
