# Hamiltonian Cycle Instruction Manager a配置
# 支持多组配置和不同的生成比例

instruction_generators:
  easy:
    config:
      difficulty: "easy"
      num_vertices: [15, 20]
      edge_density: 0.2
  medium:
    config:
      difficulty: "medium"
      num_vertices: [20, 30]
      edge_density: 0.3
  hard:
    config:
      difficulty: "hard"
      num_vertices: [30, 40]
      edge_density: 0.4
  bench:
    config:
      difficulty: "bench"
      num_vertices: [40, 50]
      edge_density: 0.5

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.NP.hamiltonian_cycle.instruction_generator.NpHamiltonianCycleInstructionGenerator"
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 10
    test: 10
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
