# BBEH Geometric Shapes Instruction Generator 配置

instruction_generators:
  low:
    config:
      distract_density: 0.3
      max_distractors: 2
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_geometric_shapes/configs/bbeh_geometric_shapes_interaction_config.yaml"
    generation_ratio: 1.0

  medium:
    config:
      distract_density: 0.5
      max_distractors: 3
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_geometric_shapes/configs/bbeh_geometric_shapes_interaction_config.yaml"
    generation_ratio: 1.5

  high:
    config:
      distract_density: 0.7
      max_distractors: 4
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_geometric_shapes/configs/bbeh_geometric_shapes_interaction_config.yaml"
    generation_ratio: 1.0

global_config:
  class_name: "internbootcamp.bootcamps.bbeh_bootcamps.bbeh_geometric_shapes.instruction_generator.BbehGeometricShapesInstructionGenerator"
  enable_random_seed: true
  default_seed: 2025
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: false


