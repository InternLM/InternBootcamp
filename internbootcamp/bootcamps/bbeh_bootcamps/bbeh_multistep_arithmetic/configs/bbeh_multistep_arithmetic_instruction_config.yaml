# BBEH Multistep Arithmetic Instruction Generator 配置

instruction_generators:
  low:
    config:
      num_operators: 4
      max_depth: 6
      reuse_prob: 0.0
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_multistep_arithmetic/configs/bbeh_multistep_arithmetic_interaction_config.yaml"
    generation_ratio: 1.0

  medium:
    config:
      num_operators: 8
      max_depth: 8
      reuse_prob: 0.0
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_multistep_arithmetic/configs/bbeh_multistep_arithmetic_interaction_config.yaml"
    generation_ratio: 1.5

  high:
    config:
      num_operators: 12
      max_depth: 10
      reuse_prob: 0.0
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_multistep_arithmetic/configs/bbeh_multistep_arithmetic_interaction_config.yaml"
    generation_ratio: 1.0

global_config:
  class_name: "internbootcamp.bootcamps.bbeh_bootcamps.bbeh_multistep_arithmetic.instruction_generator.BbehMultistepArithmeticInstructionGenerator"
  enable_random_seed: true
  default_seed: 2025
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: false


