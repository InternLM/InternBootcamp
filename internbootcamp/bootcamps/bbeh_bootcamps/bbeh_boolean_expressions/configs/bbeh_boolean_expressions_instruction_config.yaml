# BBEH Boolean Expressions Instruction Generator 配置

instruction_generators:
  low:
    config:
      max_depth: 3
      num_choices: 5
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_boolean_expressions/configs/bbeh_boolean_expressions_interaction_config.yaml"
    generation_ratio: 1.0

  medium:
    config:
      max_depth: 4
      num_choices: 5
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_boolean_expressions/configs/bbeh_boolean_expressions_interaction_config.yaml"
    generation_ratio: 1.5

  high:
    config:
      max_depth: 5
      num_choices: 6
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_boolean_expressions/configs/bbeh_boolean_expressions_interaction_config.yaml"
    generation_ratio: 1.0

global_config:
  class_name: "internbootcamp.bootcamps.bbeh_bootcamps.bbeh_boolean_expressions.instruction_generator.BbehBooleanExpressionsInstructionGenerator"
  enable_random_seed: true
  default_seed: 2025
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: false

