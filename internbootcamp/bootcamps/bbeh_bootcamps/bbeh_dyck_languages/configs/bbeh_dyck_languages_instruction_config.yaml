instruction_generators:
  low:
    config:
      min_length: 6
      max_length: 14
      error_prob: 0.7
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_dyck_languages/configs/bbeh_dyck_languages_interaction_config.yaml"
    generation_ratio: 1.0

  medium:
    config:
      min_length: 8
      max_length: 18
      error_prob: 0.8
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_dyck_languages/configs/bbeh_dyck_languages_interaction_config.yaml"
    generation_ratio: 1.5

  high:
    config:
      min_length: 10
      max_length: 24
      error_prob: 0.9
    interaction_config_path: "internbootcamp/bootcamps/bbeh_bootcamps/bbeh_dyck_languages/configs/bbeh_dyck_languages_interaction_config.yaml"
    generation_ratio: 1.0

global_config:
  class_name: "internbootcamp.bootcamps.bbeh_bootcamps.bbeh_dyck_languages.instruction_generator.BbehDyckLanguagesInstructionGenerator"
  enable_random_seed: true
  default_seed: 2025
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: false


