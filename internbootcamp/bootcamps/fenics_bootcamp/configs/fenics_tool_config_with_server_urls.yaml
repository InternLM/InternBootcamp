tools:
- class_name: internbootcamp.src.base_mcp_tool.BaseMCPTool
  config:
    type: native
    mcp_server_url: http://100.103.17.59:49536/ThermalSimulationTool
    timeout_per_query: 600
  tool_schema:
    type: function
    function:
      name: run_thermal_simulation
      description: 运行非线性有限元热仿真（通过 API）。返回两个监测点的温度和全局最高温度。注意：你必须显式传入当前任务指定的所有物理参数。
      parameters:
        type: object
        properties:
          length:
            type: number
            description: 导热板的长度 [m]
          width:
            type: number
            description: 导热板的宽度 [m]
          kappa_base:
            type: number
            description: 材料的基础热导率 [W/(m·K)]
          alpha:
            type: number
            description: 材料热导率的非线性系数
          source_amp:
            type: number
            description: 内部热源的强度
          flux_left:
            type: number
            description: 施加在左边界的热通量 [W/m²] (控制变量)
          flux_bottom:
            type: number
            description: 施加在下边界的热通量 [W/m²] (控制变量)
          monitor1_x:
            type: number
            description: 监测点 A 的 X 坐标 [m]
          monitor1_y:
            type: number
            description: 监测点 A 的 Y 坐标 [m]
          monitor2_x:
            type: number
            description: 监测点 B 的 X 坐标 [m]
          monitor2_y:
            type: number
            description: 监测点 B 的 Y 坐标 [m]
        required:
        - length
        - width
        - kappa_base
        - alpha
        - source_amp
        - flux_left
        - flux_bottom
        - monitor1_x
        - monitor1_y
        - monitor2_x
        - monitor2_y
