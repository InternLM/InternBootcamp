# Example Instruction Manager 配置
# 支持多组配置和不同的生成比例

instruction_generators:
  basic:
    config:
      scale_range: [100, 800]
      base_gross_margin_range: [0.20, 0.45]
      opex_ratio_range: [0.08, 0.15]
      tax_rate: 0.25
      inventory_days_range: [45, 90]
      receivable_days_range: [30, 60]
      payable_days_range: [40, 80]
      fixed_asset_ratio_range: [0.25, 0.50]
      initial_leverage_range: [1.5, 2.5]
      dividend_payout_ratio: 0.3
      volatility_revenue: 0.10
      prob_cost_shock: 0.3
      prob_seo_event: 0.2   
    tool_config_path: "internbootcamp/bootcamps/finance_bootcamp/configs/finance_tool_config.yaml"
    interaction_config_path: "internbootcamp/bootcamps/finance_bootcamp/configs/finance_interaction_config.yaml"
    generation_ratio: 1  

# 全局配置
global_config:
# 指令管理器类的完整相对路径
  class_name: "internbootcamp.bootcamps.finance_bootcamp.finance_instruction_generator.FinanceInstructionGenerator"
  
  # 是否启用随机种子
  enable_random_seed: true
  
  # 默认种子值
  default_seed: 999
  
  # 默认数据集划分和样本数
  default_split_samples:
    train: 100000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  # gen_parquet: true