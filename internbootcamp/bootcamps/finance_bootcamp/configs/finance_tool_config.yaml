tools:
  - class_name: "internbootcamp.bootcamps.finance_bootcamp.finance_tools.MetCalTool"
    config: 
      type: "native"
    tool_schema:
      type: "function"
      function:
        name: "calculate_metrics"
        description: "根据输入的基础财务报表数据，计算关键的派生财务指标，具体包括：EBITDA、毛利率、销售净利润率、EBITDA/营业收入、经营活动现金净流量/营业收入、资本支出/收入、资本支出/经营活动现金净流量、付息债务、短期债务、资产负债率、短期债务/总债务、流动比率、速动比率、现金/短期债务、(现金+EBITDA)/短期债务。所有金额单位统一为“亿元”。"
        parameters:
          type: "object"
          properties:
            营业收入:
              type: "number"
            营业利润:
              type: "number"
            净利润:
              type: "number"
            固定资产折旧、油气资产折耗、生产性生物资产折旧:
              type: "number"
            无形资产摊销:
              type: "number"
            营业成本:
              type: "number"
            经营活动现金净流量: 
              type: "number"
            资本支出:
              type: "number"
            短期借款: 
              type: "number"
            长期借款:
              type: "number"
            应付债券: 
              type: "number"
            租赁负债: 
              type: "number"
            一年内到期的非流动负债: 
              type: "number"
            应付短期融资款: 
              type: "number"
            总资产:
              type: "number"
            所有者权益:
              type: "number"
            负债与所有者权益合计:
              type: "number"
            流动资产合计: 
              type: "number"
            流动负债合计: 
              type: "number"
            存货净额: 
              type: "number"
            货币资金: 
              type: "number"
          required: ["营业收入", "营业利润", "净利润", "固定资产折旧、油气资产折耗、生产性生物资产折旧", "无形资产摊销", "营业成本", "经营活动现金净流量", "资本支出", "短期借款", "长期借款", "应付债券", "租赁负债", "一年内到期的非流动负债", "应付短期融资款", "总资产", "所有者权益", "负债与所有者权益合计", "流动资产合计", "流动负债合计", "存货净额", "货币资金"]