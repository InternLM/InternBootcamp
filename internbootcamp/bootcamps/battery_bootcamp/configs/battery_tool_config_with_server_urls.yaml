tools:
- class_name: internbootcamp.src.base_mcp_tool.BaseMCPTool
  config:
    type: native
    mcp_server_url: http://100.104.49.17:49707/BatterySimulationTool
    timeout_per_query: 600
  tool_schema:
    type: function
    function:
      name: run_battery_simulation
      description: 执行锂离子电池电化学仿真。注意：你必须显式传入当前任务指定的环境参数（倍率、温度等），否则仿真结果将不匹配当前工况。
      parameters:
        type: object
        properties:
          pos_thickness:
            type: number
            description: 正极厚度 [m] (设计变量)
          pos_porosity:
            type: number
            description: 正极孔隙率 (0-1) (设计变量)
          c_rate:
            type: string
            description: 放电倍率 (例如 '2C', '3C', '4C')
          ambient_temp:
            type: number
            description: 环境温度 [K]
          heat_transfer_coeff:
            type: number
            description: 总散热系数 [W.m-2.K-1]
          chemistry:
            type: string
            description: 化学体系名称 (例如 'Chen2020')
        required:
        - pos_thickness
        - pos_porosity
        - c_rate
        - ambient_temp
        - heat_transfer_coeff
        - chemistry
