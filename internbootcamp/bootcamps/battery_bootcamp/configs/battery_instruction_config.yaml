# ============================================================
# Battery Design Instruction Generator Configuration
# ============================================================

instruction_generators:
  basic:
    config:
      # --- 1. 物理环境空间 (Domain Context) ---
      chemistry: "Chen2020"
      
      # 列表代表离散选项，列表区间 [min, max] 代表连续均匀采样
      c_rate_options: ["2C", "3C", "4C"]
      ambient_temp_range: [298.0, 310.0]     # 单位: K
      heat_transfer_coeff_range: [5.0, 15.0] # 单位: W/(m2·K)
      
      # --- 2. Oracle 搜索空间 (Search Space) ---
      # 用于生成 Ground Truth 的参数范围
      thickness_range: [60.0e-6, 140.0e-6]   # 单位: m
      porosity_range: [0.25, 0.45]           # 单位: 1 (无量纲)
      
      # --- 3. 难度与目标控制 (Difficulty Control) ---
      # 目标比能量 = Oracle结果 * ratio 
      # (0.99 表示只要达到最优解的 99% 即可，降低此值可降低难度)
      target_energy_ratio: 0.99 
      
      # 目标温度 = Oracle结果 + tolerance
      # (允许温度比最优解高多少度)
      target_temp_tolerance: 1.0 
      
      # --- 4. Agent 约束 (Constraints) ---
      # 允许调用仿真工具的最大次数
      max_tool_calls: 5

    # 外部工具配置文件路径
    tool_config_path: "internbootcamp/bootcamps/battery_bootcamp/configs/battery_tool_config.yaml"
    interaction_config_path: "internbootcamp/bootcamps/battery_bootcamp/configs/battery_interaction_config.yaml"
    generation_ratio: 1.0

# --- 全局系统配置 ---
global_config:
  class_name: "internbootcamp.bootcamps.battery_bootcamp.battery_instruction_generator.BatteryDesignInstructionGenerator"
  enable_random_seed: true
  default_seed: 42
  default_split_samples:
    train: 1000
    test: 100
  shuffle: true
  gen_parquet: true