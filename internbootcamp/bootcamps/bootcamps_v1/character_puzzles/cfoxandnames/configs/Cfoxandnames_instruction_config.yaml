instruction_generators:
  config_1:
    config:
      min_names: 5
      max_names: 15
      min_length: 3
      max_length: 15
      valid_ratio: 0.3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      min_names: 1
      max_names: 5
      min_length: 1
      max_length: 5
      valid_ratio: 0.7
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      min_names: 3
      max_names: 10
      min_length: 1
      max_length: 10
      valid_ratio: 0.5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cfoxandnames/configs/Cfoxandnames_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.character_puzzles.cfoxandnames.Cfoxandnames_instruction_generator.CfoxandnamesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
