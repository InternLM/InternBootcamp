instruction_generators:
  config_1:
    config:
      num_letters: 5
      num_add: 4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      num_letters: 4
      num_add: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      num_letters: 4
      num_add: 3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      num_letters: 3
      num_add: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/character_puzzles/cryptomath/configs/cryptomath_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.character_puzzles.cryptomath.cryptomath_instruction_generator.CryptomathInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
