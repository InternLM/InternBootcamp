instruction_generators:
  config_1:
    config:
      attribute_pools: {'zoology': {'attributes': ['stripes', 'hooves', 'herbivorous'], 'derived_positive': 'live in herds', 'derived_negative': 'solitary', 'objects': ['zebras', 'lions']}, 'physics': {'attributes': ['mass', 'velocity', 'acceleration'], 'derived_positive': 'force', 'derived_negative': 'no force', 'objects': ['moving cars', 'stationary objects']}, 'computer_science': {'attributes': ['RAM', 'CPU', 'storage'], 'derived_positive': 'processing power', 'derived_negative': 'low performance', 'objects': ['desktops', 'smartphones']}}
      num_questions: 15
      difficulty_level: hard
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicanalogicalreasoning/configs/korLogicAnalogicalReasoning_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicanalogicalreasoning/configs/korLogicAnalogicalReasoning_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      attribute_pools: {'geology': {'attributes': ['igneous', 'metamorphic', 'sedimentary'], 'derived_positive': 'rock formation', 'derived_negative': 'non-rock', 'objects': ['mountains', 'soil']}, 'astronomy': {'attributes': ['orbit', 'gravity', 'atmosphere'], 'derived_positive': 'supports life', 'derived_negative': 'no life', 'objects': ['Earth', 'Mars']}, 'ecology': {'attributes': ['food chain', 'habitat', 'predators'], 'derived_positive': 'species survival', 'derived_negative': 'extinction risk', 'objects': ['wolves', 'rabbits']}}
      num_questions: 5
      difficulty_level: easy
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicanalogicalreasoning/configs/korLogicAnalogicalReasoning_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicanalogicalreasoning/configs/korLogicAnalogicalReasoning_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.logical_reasoning.korlogicanalogicalreasoning.korLogicAnalogicalReasoning_instruction_generator.KorlogicanalogicalreasoningInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
