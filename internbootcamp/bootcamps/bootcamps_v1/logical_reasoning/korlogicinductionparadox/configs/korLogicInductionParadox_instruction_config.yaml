instruction_generators:
  config_1:
    config:
      example_pool: [{'phenomenon': '桥梁在特定天气结构变形', 'hypotheses': ['温度膨胀假说', '湿度膨胀假说'], 'contradiction': '温度与湿度变化无法同时发生', 'correct_answer': 'A'}, {'phenomenon': '股票价格在特定经济指标发布时上涨', 'hypotheses': ['利率变化假说', '通货膨胀假说'], 'contradiction': '利率与通货膨胀无法同时变化', 'correct_answer': 'A'}]
      symbolic_templates: ['{p} ∧ ({q1} ∨ {q2}) → ⊥', '∀x(R(x) → B(x)) ∧ ∃x(¬B(x) ∧ ¬R(x))', '{p} ⇒ ({h1} ∧ {h2}), 其中{h1}与{h2}矛盾']
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicinductionparadox/configs/korLogicInductionParadox_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicinductionparadox/configs/korLogicInductionParadox_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      example_pool: [{'phenomenon': '计算机程序在特定条件下崩溃', 'hypotheses': ['内存泄漏假说', 'CPU过载假说'], 'contradiction': '内存泄漏与CPU过载无法同时发生', 'correct_answer': 'A'}, {'phenomenon': '鸟类在特定季节迁徙', 'hypotheses': ['日照时间假说', '食物供应假说'], 'contradiction': '日照时间与食物供应变化无法同时满足', 'correct_answer': 'A'}, {'phenomenon': '化学反应在特定温度下发生', 'hypotheses': ['催化剂假说', '压力变化假说'], 'contradiction': '催化剂与压力变化无法同时作用', 'correct_answer': 'A'}]
      symbolic_templates: ['({q1} ∧ {q2}) → ⊥', '∀x(R(x) → B(x)) ∧ ∀x(¬B(x)→¬R(x))', '{p} ⇒ ({h1} ∨ {h2} ∨ {h3}), 其中{h1}、{h2}、{h3}两两矛盾']
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicinductionparadox/configs/korLogicInductionParadox_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/logical_reasoning/korlogicinductionparadox/configs/korLogicInductionParadox_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.logical_reasoning.korlogicinductionparadox.korLogicInductionParadox_instruction_generator.KorlogicinductionparadoxInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
