    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/cdimaandsalad/configs/Cdimaandsalad_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/cdimaandsalad/configs/Cdimaandsalad_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 30
      k_min: 2
      k_max: 7
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/cdimaandsalad/configs/Cdimaandsalad_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/cdimaandsalad/configs/Cdimaandsalad_interaction_config.yaml
