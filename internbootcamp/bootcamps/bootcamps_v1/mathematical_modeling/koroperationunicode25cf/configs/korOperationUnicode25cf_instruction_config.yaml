instruction_generators:
  config_1:
    config:
      operator_symbols: ['●', '★', '◆']
      compute_prob: 0.8
      function_list: ['m*x', 'x**n', 'sin(x)', 'cos(x)', '1/x']
      a_range: [-10, 10]
      b_range: [-10, 10]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/koroperationunicode25cf/configs/korOperationUnicode25cf_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/koroperationunicode25cf/configs/korOperationUnicode25cf_interaction_config.yaml
    generation_ratio: 0.17
  config_2:
