    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/celectriccharges/configs/Celectriccharges_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_points: 2
      max_points: 12
      x_range: [-200, 200]
      y_range: [-100, 100]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/celectriccharges/configs/Celectriccharges_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/celectriccharges/configs/Celectriccharges_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_points: 1
      max_points: 5
      x_range: [-50, 50]
      y_range: [-50, 50]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/celectriccharges/configs/Celectriccharges_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/celectriccharges/configs/Celectriccharges_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
