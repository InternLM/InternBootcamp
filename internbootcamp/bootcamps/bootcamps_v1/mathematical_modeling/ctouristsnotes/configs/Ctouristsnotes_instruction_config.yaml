      max_m: 15
      invalid_prob: 0.6
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.mathematical_modeling.ctouristsnotes.Ctouristsnotes_instruction_generator.CtouristsnotesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
