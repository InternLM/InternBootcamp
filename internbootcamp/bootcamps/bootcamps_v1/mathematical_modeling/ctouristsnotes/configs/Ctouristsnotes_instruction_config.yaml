      max_n: 100
      min_m: 2
      max_m: 5
      invalid_prob: 0.3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_n: 100
      max_n: 500
      min_m: 4
      max_m: 10
      invalid_prob: 0.5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 1
      max_n: 50
      min_m: 1
      max_m: 3
      invalid_prob: 0.2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ctouristsnotes/configs/Ctouristsnotes_interaction_config.yaml
