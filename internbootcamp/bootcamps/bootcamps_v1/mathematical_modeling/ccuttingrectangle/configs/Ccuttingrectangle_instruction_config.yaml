    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ccuttingrectangle/configs/Ccuttingrectangle_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/ccuttingrectangle/configs/Ccuttingrectangle_interaction_config.yaml
