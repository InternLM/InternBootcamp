instruction_generators:
  config_1:
    config:
      num_numbers: 4
      range_max: 10
      target_max: 30
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      num_numbers: 5
      range_max: 10
      target_max: 35
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      num_numbers: 6
      range_max: 10
      target_max: 40
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/game24/configs/game24_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.mathematical_modeling.game24.game24_instruction_generator.Game24InstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
