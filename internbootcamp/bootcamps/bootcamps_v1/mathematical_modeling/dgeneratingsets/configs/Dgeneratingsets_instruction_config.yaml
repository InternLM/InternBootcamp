    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/dgeneratingsets/configs/Dgeneratingsets_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/dgeneratingsets/configs/Dgeneratingsets_interaction_config.yaml
