    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/elittleelephantandlcm/configs/Elittleelephantandlcm_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/mathematical_modeling/elittleelephantandlcm/configs/Elittleelephantandlcm_interaction_config.yaml
