    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/cryptography/koroperationunicode2295/configs/korOperationUnicode2295_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/cryptography/koroperationunicode2295/configs/korOperationUnicode2295_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_operand: 8
      equation_prob: 0.4
      allow_division: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/cryptography/koroperationunicode2295/configs/korOperationUnicode2295_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/cryptography/koroperationunicode2295/configs/korOperationUnicode2295_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_operand: 10
