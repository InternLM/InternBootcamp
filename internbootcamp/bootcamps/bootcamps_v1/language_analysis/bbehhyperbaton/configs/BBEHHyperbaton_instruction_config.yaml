instruction_generators:
  # 基础配置
  basic_config:
    config:
      # TODO: 根据原始__init__参数调整
      param1: value1
      param2: value2
    generation_ratio: 0.5

  # 高级配置  
  advanced_config:
    config:
      # TODO: 根据原始__init__参数调整
      param1: value1_advanced
      param2: value2_advanced
    generation_ratio: 0.5

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.language_analysis.bbehhyperbaton.BBEHHyperbaton_instruction_generator.BbehhyperbatonInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: true
