    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/unknown/epainttree/configs/Epainttree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/unknown/epainttree/configs/Epainttree_interaction_config.yaml
