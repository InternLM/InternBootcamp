instruction_generators:
  config_1:
    config:
      size: 6
      group_size_range: [2, 3]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      size: 4
      group_size_range: [1, 2]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      size: 6
      group_size_range: [2, 4]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      size: 4
      group_size_range: [2, 3]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/calcudoku/configs/calcudoku_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.calcudoku.calcudoku_instruction_generator.CalcudokuInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
