    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/chelpcaretaker/configs/Chelpcaretaker_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/chelpcaretaker/configs/Chelpcaretaker_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 2
      max_n: 5
      min_m: 2
      max_m: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/chelpcaretaker/configs/Chelpcaretaker_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/chelpcaretaker/configs/Chelpcaretaker_interaction_config.yaml
