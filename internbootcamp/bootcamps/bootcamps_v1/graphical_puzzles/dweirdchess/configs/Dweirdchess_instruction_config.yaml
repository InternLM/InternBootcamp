instruction_generators:
  config_1:
    config:
      n: 10
      min_o: 2
      max_o: 4
      move_types: ['knight']
      move_type: knight
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 5
      min_o: 1
      max_o: 3
      move_types: ['random', 'rook']
      move_type: rook
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 25
      min_o: 2
      max_o: 4
      move_types: ['random', 'rook', 'knight']
      move_type: random
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 20
      min_o: 3
      max_o: 5
      move_types: ['rook', 'knight']
      move_type: rook
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/dweirdchess/configs/Dweirdchess_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.dweirdchess.Dweirdchess_instruction_generator.DweirdchessInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
