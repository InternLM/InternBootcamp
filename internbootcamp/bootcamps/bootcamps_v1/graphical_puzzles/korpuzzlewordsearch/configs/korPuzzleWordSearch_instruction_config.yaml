instruction_generators:
  config_1:
    config:
      grid_size: 20
      word_list: ['PYTHON', 'JAVASCRIPT', 'HTML', 'CSS', 'SQL', 'RUBY']
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      grid_size: 10
      word_list: ['COMPUTER', 'PROGRAM', 'ALGORITHM']
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      grid_size: 8
      word_list: ['SUN', 'MOON', 'STARS', 'PLANET']
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      grid_size: 13
      word_list: None
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/korpuzzlewordsearch/configs/korPuzzleWordSearch_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.korpuzzlewordsearch.korPuzzleWordSearch_instruction_generator.KorpuzzlewordsearchInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
