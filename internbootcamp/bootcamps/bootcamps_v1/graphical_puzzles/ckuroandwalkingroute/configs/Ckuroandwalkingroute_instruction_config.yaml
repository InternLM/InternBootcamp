instruction_generators:
  config_1:
    config:
      max_n: 8
      default_n: 4
      x: 2
      y: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_n: 10
      default_n: 5
      x: 3
      y: 7
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_n: 15
      default_n: 10
      x: 5
      y: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ckuroandwalkingroute/configs/Ckuroandwalkingroute_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.ckuroandwalkingroute.Ckuroandwalkingroute_instruction_generator.CkuroandwalkingrouteInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
