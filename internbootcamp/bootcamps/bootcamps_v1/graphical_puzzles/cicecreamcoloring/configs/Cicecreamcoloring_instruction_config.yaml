instruction_generators:
  config_1:
    config:
      n_range: [3, 5]
      m_range: [2, 5]
      max_type_nodes: 3
      prob_assign: 0.8
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_range: [10, 20]
      m_range: [10, 20]
      max_type_nodes: 10
      prob_assign: 0.6
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_range: [20, 30]
      m_range: [20, 30]
      max_type_nodes: 15
      prob_assign: 0.5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/cicecreamcoloring/configs/Cicecreamcoloring_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.cicecreamcoloring.Cicecreamcoloring_instruction_generator.CicecreamcoloringInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
