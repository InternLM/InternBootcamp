instruction_generators:
  config_1:
    config:
      size: [2, 2]
      start_pos: [0, 0]
      end_pos: [1, 1]
      max_solution_step: 4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      size: [3, 3]
      start_pos: [0, 0]
      end_pos: [2, 2]
      max_solution_step: 9
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      size: [4, 4]
      start_pos: [0, 0]
      end_pos: [3, 3]
      max_solution_step: 16
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      size: [5, 5]
      start_pos: [0, 0]
      end_pos: [4, 4]
      max_solution_step: 25
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/arrowmaze/configs/arrowmaze_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.arrowmaze.arrowmaze_instruction_generator.ArrowmazeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
