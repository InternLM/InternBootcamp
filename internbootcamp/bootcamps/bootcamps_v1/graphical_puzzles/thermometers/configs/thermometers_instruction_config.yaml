instruction_generators:
  config_1:
    config:
      size: 6
      num_thermometers: 4
      enforce_latin: True
      max_retries: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      size: 5
      num_thermometers: 4
      enforce_latin: True
      max_retries: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      size: 6
      num_thermometers: 5
      enforce_latin: True
      max_retries: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      size: 4
      num_thermometers: 2
      enforce_latin: True
      max_retries: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/thermometers/configs/thermometers_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.thermometers.thermometers_instruction_generator.ThermometersInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
