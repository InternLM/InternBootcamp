instruction_generators:
  config_1:
    config:
      max_stars: 12
      min_param: 1
      max_param: 4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_stars: 20
      min_param: 2
      max_param: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_stars: 15
      min_param: 1
      max_param: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/graphical_puzzles/ddonkeyandstars/configs/Ddonkeyandstars_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.graphical_puzzles.ddonkeyandstars.Ddonkeyandstars_instruction_generator.DdonkeyandstarsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
