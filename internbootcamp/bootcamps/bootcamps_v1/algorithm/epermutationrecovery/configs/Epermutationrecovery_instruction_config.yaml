instruction_generators:
  config_1:
    config:
      n_range: [1, 25]
      mask_prob: 0.6
      unsolve_prob: 0.1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_range: [1, 20]
      mask_prob: 0.5
      unsolve_prob: 0.2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_range: [1, 10]
      mask_prob: 0.4
      unsolve_prob: 0.3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_range: [1, 15]
      mask_prob: 0.3
      unsolve_prob: 0.4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/epermutationrecovery/configs/Epermutationrecovery_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.epermutationrecovery.Epermutationrecovery_instruction_generator.EpermutationrecoveryInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
