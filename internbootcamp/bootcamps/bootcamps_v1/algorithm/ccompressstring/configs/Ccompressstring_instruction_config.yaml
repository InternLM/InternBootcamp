    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccompressstring/configs/Ccompressstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccompressstring/configs/Ccompressstring_interaction_config.yaml
