instruction_generators:
  config_1:
    config:
      min_n: 10
      max_n: 100
      min_k: 5
      max_k: 20
      min_val: -1000
      max_val: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bminimization/configs/Bminimization_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bminimization/configs/Bminimization_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      min_n: 2
      max_n: 20
      min_k: 1
      max_k: 5
      min_val: -100
      max_val: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bminimization/configs/Bminimization_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bminimization/configs/Bminimization_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.bminimization.Bminimization_instruction_generator.BminimizationInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
