instruction_generators:
  config_1:
    config:
      n_min: 1
      n_max: 20
      k_ratio: [0.3, 0.7]
      random_seed: 666
      test_case_type: invalid
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dolyaandmagicalsquare/configs/Dolyaandmagicalsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dolyaandmagicalsquare/configs/Dolyaandmagicalsquare_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      n_min: 1
      n_max: 10
      k_ratio: [0.1, 0.9]
      random_seed: 42
      test_case_type: mixed
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dolyaandmagicalsquare/configs/Dolyaandmagicalsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dolyaandmagicalsquare/configs/Dolyaandmagicalsquare_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dolyaandmagicalsquare.Dolyaandmagicalsquare_instruction_generator.DolyaandmagicalsquareInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
