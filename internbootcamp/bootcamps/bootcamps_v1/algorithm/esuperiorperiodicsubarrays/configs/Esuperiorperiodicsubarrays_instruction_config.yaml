instruction_generators:
  config_1:
    config:
      max_n: 4
      max_a: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 5
      max_a: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 2
      max_a: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 3
      max_a: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esuperiorperiodicsubarrays/configs/Esuperiorperiodicsubarrays_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.esuperiorperiodicsubarrays.Esuperiorperiodicsubarrays_instruction_generator.EsuperiorperiodicsubarraysInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
