instruction_generators:
  config_1:
    config:
      default_n: 3
      default_m: 5
      n_range: [3, 4]
      m_range: [5, 8]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      default_n: 4
      default_m: 6
      n_range: [3, 5]
      m_range: [6, 12]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      default_n: 3
      default_m: 5
      n_range: [3, 5]
      m_range: [5, 10]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      default_n: 2
      default_m: 4
      n_range: [2, 3]
      m_range: [4, 7]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/clatinsquare/configs/Clatinsquare_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.clatinsquare.Clatinsquare_instruction_generator.ClatinsquareInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
