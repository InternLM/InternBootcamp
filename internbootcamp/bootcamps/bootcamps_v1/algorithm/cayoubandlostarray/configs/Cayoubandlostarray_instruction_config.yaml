    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cayoubandlostarray/configs/Cayoubandlostarray_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 1
      n_max: 10
