    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 3
      n_max: 7
      v_min: -8
      v_max: 8
      c_max: 5
      q_min: 1
      q_max: 3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_interaction_config.yaml
