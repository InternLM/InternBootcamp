      n_min: 2
      n_max: 5
      v_min: -10
      v_max: 10
      c_max: 2
      q_min: 1
      q_max: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/echoosingballs/configs/Echoosingballs_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.echoosingballs.Echoosingballs_instruction_generator.EchoosingballsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
