instruction_generators:
  config_1:
    config:
      n_min: 2
      n_max: 20
      x_min: 10
      x_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_min: 3
      n_max: 20
      x_min: 1
      x_max: 200
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 4
      n_max: 30
      x_min: 5
      x_max: 500
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_min: 2
      n_max: 10
      x_min: 0
      x_max: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bandsequences/configs/Bandsequences_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.bandsequences.Bandsequences_instruction_generator.BandsequencesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
