instruction_generators:
  config_1:
    config:
      max_heads: 4
      max_tracks: 8
      max_value: 500000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_heads: 5
      max_tracks: 10
      max_value: 1000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_heads: 3
      max_tracks: 5
      max_value: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ereadtime/configs/Ereadtime_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ereadtime.Ereadtime_instruction_generator.EreadtimeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
