instruction_generators:
  config_1:
    config:
      min_n: 1
      max_n: 1000
      solvable_probability: 0.7
      value_range: [0, 10000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_n: 1
      max_n: 500
      solvable_probability: 0.5
      value_range: [0, 1000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 2
      max_n: 500
      solvable_probability: 0.4
      value_range: [0, 100]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      min_n: 1
      max_n: 200
      solvable_probability: 0.3
      value_range: [0, 100]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ghappyline/configs/Ghappyline_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ghappyline.Ghappyline_instruction_generator.GhappylineInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
