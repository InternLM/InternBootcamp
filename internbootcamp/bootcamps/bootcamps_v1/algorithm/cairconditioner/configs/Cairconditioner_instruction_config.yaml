instruction_generators:
  config_1:
    config:
      n_min: 1
      n_max: 50
      m_min: -100
      m_max: 100
      time_delta_min: 0
      time_delta_max: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_min: 10
      n_max: 50
      m_min: -1000
      m_max: 1000
      time_delta_min: 0
      time_delta_max: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_min: 50
      n_max: 100
      m_min: -200
      m_max: 200
      time_delta_min: 0
      time_delta_max: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cairconditioner/configs/Cairconditioner_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cairconditioner.Cairconditioner_instruction_generator.CairconditionerInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
