instruction_generators:
  config_1:
    config:
      x_range: [-100, 100]
      y_range: [-100, 100]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      x_range: [-1000000, 1000000]
      y_range: [-1000000, 1000000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      x_range: [-1000, 1000]
      y_range: [-1000, 1000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      x_range: [-100000, 100000]
      y_range: [-100000, 100000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpolyline/configs/Dpolyline_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dpolyline.Dpolyline_instruction_generator.DpolylineInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
