instruction_generators:
  config_1:
    config:
      a_range: [1, 10000]
      b_shift_range: [1, 10000]
      n_range: [1, 20]
      m_range: [1, 20]
      y_range: [-5000, 5000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      a_range: [1, 1000]
      b_shift_range: [1, 1000]
      n_range: [1, 5]
      m_range: [1, 5]
      y_range: [-1000, 1000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      a_range: [1, 2000]
      b_shift_range: [1, 2000]
      n_range: [1, 3]
      m_range: [1, 3]
      y_range: [-1500, 1500]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      a_range: [1, 10000]
      b_shift_range: [1, 10000]
      n_range: [1, 15]
      m_range: [1, 15]
      y_range: [-4000, 4000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dbuildingbridge/configs/Dbuildingbridge_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dbuildingbridge.Dbuildingbridge_instruction_generator.DbuildingbridgeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
