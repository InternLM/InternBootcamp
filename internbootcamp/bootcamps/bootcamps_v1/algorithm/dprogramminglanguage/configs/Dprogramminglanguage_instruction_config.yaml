instruction_generators:
  config_1:
    config:
      max_procedures: 12
      max_variables: 8
      max_calls: 15
      procedure_name_length: 6
      var_name_length: 4
      t_probability: 0.5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_procedures: 10
      max_variables: 10
      max_calls: 5
      procedure_name_length: 3
      var_name_length: 3
      t_probability: 0.2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_procedures: 20
      max_variables: 20
      max_calls: 10
      procedure_name_length: 7
      var_name_length: 7
      t_probability: 0.4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dprogramminglanguage/configs/Dprogramminglanguage_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dprogramminglanguage.Dprogramminglanguage_instruction_generator.DprogramminglanguageInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
