instruction_generators:
  config_1:
    config:
      min_n: 1
      max_n: 5
      min_val: 1
      max_val: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      min_n: 5
      max_n: 20
      min_val: 10
      max_val: 10000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      min_n: 3
      max_n: 10
      min_val: 1
      max_val: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bkarenandtest/configs/Bkarenandtest_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.bkarenandtest.Bkarenandtest_instruction_generator.BkarenandtestInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
