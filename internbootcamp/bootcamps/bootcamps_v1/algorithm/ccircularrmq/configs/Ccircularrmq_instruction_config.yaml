instruction_generators:
  config_1:
    config:
      n_range: [4, 10]
      m_range: [3, 8]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_range: [6, 20]
      m_range: [5, 15]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_range: [7, 18]
      m_range: [6, 14]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_range: [5, 15]
      m_range: [4, 12]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccircularrmq/configs/Ccircularrmq_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ccircularrmq.Ccircularrmq_instruction_generator.CcircularrmqInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
