instruction_generators:
  config_1:
    config:
      n_min: 10
      n_max: 20
      h_min: 1
      h_max: 10000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_min: 5
      n_max: 10
      h_min: 1
      h_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_min: 1
      n_max: 1
      h_min: 1
      h_max: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cbasketballexercise/configs/Cbasketballexercise_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cbasketballexercise.Cbasketballexercise_instruction_generator.CbasketballexerciseInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
