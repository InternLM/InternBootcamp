instruction_generators:
  config_1:
    config:
      max_n: 50
      max_m: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 40
      max_m: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 30
      max_m: 15
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 20
      max_m: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccoloringtrees/configs/Ccoloringtrees_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ccoloringtrees.Ccoloringtrees_instruction_generator.CcoloringtreesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
