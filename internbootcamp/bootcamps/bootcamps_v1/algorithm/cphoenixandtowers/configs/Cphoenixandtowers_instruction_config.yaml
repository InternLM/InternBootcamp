      max_m: 5
      max_x: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cphoenixandtowers/configs/Cphoenixandtowers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cphoenixandtowers/configs/Cphoenixandtowers_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 5
      max_m: 3
      max_x: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cphoenixandtowers/configs/Cphoenixandtowers_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cphoenixandtowers/configs/Cphoenixandtowers_interaction_config.yaml
