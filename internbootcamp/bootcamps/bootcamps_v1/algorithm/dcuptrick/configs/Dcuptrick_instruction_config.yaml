instruction_generators:
  config_1:
    config:
      n: 3
      m: 2
      valid_probability: 0.7
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 10
      m: 5
      valid_probability: 0.75
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 5
      m: 3
      valid_probability: 0.8
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 20
      m: 10
      valid_probability: 0.9
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dcuptrick/configs/Dcuptrick_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dcuptrick.Dcuptrick_instruction_generator.DcuptrickInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
