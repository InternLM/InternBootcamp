instruction_generators:
  config_1:
    config:
      max_opening_pairs: 4
      max_balanced_pairs: 1
      max_invalid_sequences: 3
      max_unmatched_sequences: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_opening_pairs: 2
      max_balanced_pairs: 3
      max_invalid_sequences: 1
      max_unmatched_sequences: 3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_opening_pairs: 3
      max_balanced_pairs: 2
      max_invalid_sequences: 2
      max_unmatched_sequences: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_opening_pairs: 5
      max_balanced_pairs: 4
      max_invalid_sequences: 3
      max_unmatched_sequences: 4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyuhaoandaparenthesis/configs/Cyuhaoandaparenthesis_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cyuhaoandaparenthesis.Cyuhaoandaparenthesis_instruction_generator.CyuhaoandaparenthesisInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
