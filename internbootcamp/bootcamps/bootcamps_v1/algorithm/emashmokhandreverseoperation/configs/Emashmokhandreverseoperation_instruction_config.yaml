    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 4
      max_m: 5
      min_val: 1
      max_val: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 0
      max_m: 1
      min_val: 1
      max_val: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 1
      max_m: 2
      min_val: 1
      max_val: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/emashmokhandreverseoperation/configs/Emashmokhandreverseoperation_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.emashmokhandreverseoperation.Emashmokhandreverseoperation_instruction_generator.EmashmokhandreverseoperationInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
