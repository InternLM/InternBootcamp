instruction_generators:
  config_1:
    config:
      max_n: 5
      element_range: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 10
      element_range: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 15
      element_range: 150
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 30
      element_range: 300
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnumberofways/configs/Cnumberofways_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cnumberofways.Cnumberofways_instruction_generator.CnumberofwaysInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
