instruction_generators:
  config_1:
    config:
      node_range: [3, 10]
      budget_range: [1, 200]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      node_range: [6, 12]
      budget_range: [20, 50]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      node_range: [5, 10]
      budget_range: [5, 15]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      node_range: [4, 12]
      budget_range: [10, 200]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fbreakup/configs/Fbreakup_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.fbreakup.Fbreakup_instruction_generator.FbreakupInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
