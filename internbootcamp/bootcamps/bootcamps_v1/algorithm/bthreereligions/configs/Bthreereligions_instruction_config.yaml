instruction_generators:
  config_1:
    config:
      max_n: 1000
      max_q: 500
      max_op_len: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_n: 100
      max_q: 100
      max_op_len: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_n: 100000
      max_q: 1000
      max_op_len: 250
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bthreereligions/configs/Bthreereligions_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.bthreereligions.Bthreereligions_instruction_generator.BthreereligionsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
