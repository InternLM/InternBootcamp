    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmeaninglessoperations/configs/Cmeaninglessoperations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmeaninglessoperations/configs/Cmeaninglessoperations_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      all_ones_prob: 0.6
      min_k: 5
      max_k: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmeaninglessoperations/configs/Cmeaninglessoperations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmeaninglessoperations/configs/Cmeaninglessoperations_interaction_config.yaml
