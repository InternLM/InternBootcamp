instruction_generators:
  config_1:
    config:
      n_range: [1, 6]
      m_range: [1, 6]
      L_min: 0
      L_max: 10
      R_min: 0
      R_max: 15
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_range: [2, 7]
      m_range: [3, 6]
      L_min: 0
      L_max: 15
      R_min: 1
      R_max: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_range: [2, 10]
      m_range: [2, 10]
      L_min: 0
      L_max: 5
      R_min: 5
      R_max: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_range: [1, 4]
      m_range: [2, 5]
      L_min: 1
      L_max: 5
      R_min: 2
      R_max: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eheightallthesame/configs/Eheightallthesame_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.eheightallthesame.Eheightallthesame_instruction_generator.EheightallthesameInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
