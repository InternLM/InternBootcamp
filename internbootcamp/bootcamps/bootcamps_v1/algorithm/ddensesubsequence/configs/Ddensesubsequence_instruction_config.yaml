instruction_generators:
  config_1:
    config:
      max_s_length: 50
      test_edge_cases: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_s_length: 20
      test_edge_cases: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_s_length: 20
      test_edge_cases: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_s_length: 30
      test_edge_cases: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ddensesubsequence/configs/Ddensesubsequence_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ddensesubsequence.Ddensesubsequence_instruction_generator.DdensesubsequenceInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
