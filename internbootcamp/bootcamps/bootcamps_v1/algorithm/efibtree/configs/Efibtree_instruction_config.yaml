instruction_generators:
  config_1:
    config:
      yes_prob: 0.7
      case_type: YES
      max_n: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      yes_prob: 0.8
      case_type: NO
      max_n: 200000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      yes_prob: 0.2
      case_type: None
      max_n: 150000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      yes_prob: 0.3
      case_type: None
      max_n: 200000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/efibtree/configs/Efibtree_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.efibtree.Efibtree_instruction_generator.EfibtreeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
