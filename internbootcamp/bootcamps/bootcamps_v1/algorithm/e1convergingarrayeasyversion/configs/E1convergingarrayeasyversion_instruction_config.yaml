      b_min: 50
      b_max: 100
      x_min: -100
      x_max: 0
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/e1convergingarrayeasyversion/configs/E1convergingarrayeasyversion_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/e1convergingarrayeasyversion/configs/E1convergingarrayeasyversion_interaction_config.yaml
