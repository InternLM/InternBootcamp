      allow_unsolvable: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnetworkmask/configs/Cnetworkmask_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnetworkmask/configs/Cnetworkmask_interaction_config.yaml
