      edge_case_prob: 0.3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/apbinary/configs/Apbinary_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/apbinary/configs/Apbinary_interaction_config.yaml
