instruction_generators:
  config_1:
    config:
      d_range: [5, 100]
      n_range: [2, 10]
      m_range: [1, 10]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      d_range: [15, 150]
      n_range: [4, 20]
      m_range: [3, 15]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      d_range: [10, 200]
      n_range: [3, 15]
      m_range: [2, 20]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      d_range: [10, 150]
      n_range: [5, 25]
      m_range: [3, 15]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cpackagedelivery/configs/Cpackagedelivery_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cpackagedelivery.Cpackagedelivery_instruction_generator.CpackagedeliveryInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
