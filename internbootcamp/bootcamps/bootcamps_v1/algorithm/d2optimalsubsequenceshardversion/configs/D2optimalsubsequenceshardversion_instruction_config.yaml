instruction_generators:
  config_1:
    config:
      max_n: 10
      max_m: 5
      a_min: 1
      a_max: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_n: 200
      max_m: 20
      a_min: 10
      a_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_n: 100
      max_m: 20
      a_min: 5
      a_max: 500
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/d2optimalsubsequenceshardversion/configs/D2optimalsubsequenceshardversion_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.d2optimalsubsequenceshardversion.D2optimalsubsequenceshardversion_instruction_generator.D2optimalsubsequenceshardversionInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
