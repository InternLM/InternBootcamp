    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cboboniuandstring/configs/Cboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cboboniuandstring/configs/Cboboniuandstring_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 1
      n_max: 10
      string_length_min: 5
      string_length_max: 15
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cboboniuandstring/configs/Cboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cboboniuandstring/configs/Cboboniuandstring_interaction_config.yaml
