instruction_generators:
  config_1:
    config:
      max_n: 1
      max_m: 1
      max_val: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 500
      max_m: 500
      max_val: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 1000
      max_m: 2000
      max_val: 1500
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 1000
      max_m: 1000
      max_val: 2000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmaximumsubrectangle/configs/Cmaximumsubrectangle_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cmaximumsubrectangle.Cmaximumsubrectangle_instruction_generator.CmaximumsubrectangleInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
