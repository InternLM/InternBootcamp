    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cgreedyarkady/configs/Cgreedyarkady_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cgreedyarkady/configs/Cgreedyarkady_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_k: 15
      max_D: 15
