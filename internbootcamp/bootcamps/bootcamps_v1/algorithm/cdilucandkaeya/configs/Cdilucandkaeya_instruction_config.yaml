    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cdilucandkaeya/configs/Cdilucandkaeya_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cdilucandkaeya/configs/Cdilucandkaeya_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_length: 4
      max_length: 7
      special_prob: 0.22
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cdilucandkaeya/configs/Cdilucandkaeya_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cdilucandkaeya/configs/Cdilucandkaeya_interaction_config.yaml
