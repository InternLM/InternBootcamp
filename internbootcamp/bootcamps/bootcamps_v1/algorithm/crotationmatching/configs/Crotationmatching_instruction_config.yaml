instruction_generators:
  config_1:
    config:
      n_min: 10
      n_max: 20
      rotation_prob: 0.5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_min: 3
      n_max: 10
      rotation_prob: 0.3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 4
      n_max: 8
      rotation_prob: 0.6
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_min: 5
      n_max: 15
      rotation_prob: 0.7
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/crotationmatching/configs/Crotationmatching_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.crotationmatching.Crotationmatching_instruction_generator.CrotationmatchingInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
