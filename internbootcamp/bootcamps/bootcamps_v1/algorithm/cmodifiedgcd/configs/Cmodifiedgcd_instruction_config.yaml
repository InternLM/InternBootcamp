    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmodifiedgcd/configs/Cmodifiedgcd_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cmodifiedgcd/configs/Cmodifiedgcd_interaction_config.yaml
