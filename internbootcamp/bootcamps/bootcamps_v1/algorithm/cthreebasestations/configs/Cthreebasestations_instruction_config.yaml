      max_x: 2000000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_min: 1
      n_max: 100000
      min_x: 1
      max_x: 2000000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 10000
      n_max: 100000
      min_x: 1
      max_x: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_min: 1
      n_max: 1000
      min_x: 1
      max_x: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cthreebasestations/configs/Cthreebasestations_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cthreebasestations.Cthreebasestations_instruction_generator.CthreebasestationsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
