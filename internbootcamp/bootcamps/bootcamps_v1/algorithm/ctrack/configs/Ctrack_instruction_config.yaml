instruction_generators:
  config_1:
    config:
      n: 6
      m: 2
      k: 4
      max_attempts: 300
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 4
      m: 4
      k: 3
      max_attempts: 200
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 3
      m: 5
      k: 1
      max_attempts: 150
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 2
      m: 5
      k: 2
      max_attempts: 120
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctrack/configs/Ctrack_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ctrack.Ctrack_instruction_generator.CtrackInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
