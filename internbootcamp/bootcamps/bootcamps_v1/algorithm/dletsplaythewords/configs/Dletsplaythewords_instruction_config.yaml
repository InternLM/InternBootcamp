instruction_generators:
  config_1:
    config:
      min_words: 5
      max_words: 20
      min_length: 3
      max_length: 8
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      min_words: 2
      max_words: 10
      min_length: 2
      max_length: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      min_words: 3
      max_words: 15
      min_length: 4
      max_length: 12
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dletsplaythewords/configs/Dletsplaythewords_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dletsplaythewords.Dletsplaythewords_instruction_generator.DletsplaythewordsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
