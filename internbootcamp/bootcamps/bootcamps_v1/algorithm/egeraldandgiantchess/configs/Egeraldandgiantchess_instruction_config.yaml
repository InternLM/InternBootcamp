    generation_ratio: 0.25
  config_3:
    config:
      h_range: [1, 200]
      w_range: [1, 200]
      n_max: 3000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/egeraldandgiantchess/configs/Egeraldandgiantchess_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/egeraldandgiantchess/configs/Egeraldandgiantchess_interaction_config.yaml
