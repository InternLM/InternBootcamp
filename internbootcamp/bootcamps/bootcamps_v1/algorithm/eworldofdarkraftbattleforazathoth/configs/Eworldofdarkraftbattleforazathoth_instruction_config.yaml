instruction_generators:
  config_1:
    config:
      max_n: 4
      max_m: 3
      max_p: 8
      weapon_a_max: 15000
      weapon_ca_max: 1500000
      armor_b_max: 15000
      armor_cb_max: 1500000
      monster_x_max: 15000
      monster_y_max: 15000
      monster_z_max: 150
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eworldofdarkraftbattleforazathoth/configs/Eworldofdarkraftbattleforazathoth_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eworldofdarkraftbattleforazathoth/configs/Eworldofdarkraftbattleforazathoth_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      max_n: 3
      max_m: 4
      max_p: 5
      weapon_a_max: 10000
      weapon_ca_max: 1000000
      armor_b_max: 10000
      armor_cb_max: 1000000
      monster_x_max: 10000
      monster_y_max: 10000
      monster_z_max: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eworldofdarkraftbattleforazathoth/configs/Eworldofdarkraftbattleforazathoth_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eworldofdarkraftbattleforazathoth/configs/Eworldofdarkraftbattleforazathoth_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.eworldofdarkraftbattleforazathoth.Eworldofdarkraftbattleforazathoth_instruction_generator.EworldofdarkraftbattleforazathothInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
