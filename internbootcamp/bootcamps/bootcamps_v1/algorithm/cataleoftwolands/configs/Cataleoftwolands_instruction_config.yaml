instruction_generators:
  config_1:
    config:
      max_n: 5
      min_n: 2
      min_val: 0
      max_val: 10
      allow_negative: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_n: 5
      min_n: 2
      min_val: -10
      max_val: 10
      allow_negative: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_n: 10
      min_n: 5
      min_val: 5
      max_val: 20
      allow_negative: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cataleoftwolands/configs/Cataleoftwolands_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cataleoftwolands.Cataleoftwolands_instruction_generator.CataleoftwolandsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
