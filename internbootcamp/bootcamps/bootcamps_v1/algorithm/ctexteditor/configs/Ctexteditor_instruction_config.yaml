instruction_generators:
  config_1:
    config:
      min_lines: 10
      max_lines: 50
      max_chars: 10000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      min_lines: 5
      max_lines: 20
      max_chars: 5000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      min_lines: 2
      max_lines: 100
      max_chars: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctexteditor/configs/Ctexteditor_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ctexteditor.Ctexteditor_instruction_generator.CtexteditorInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
