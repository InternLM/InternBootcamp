    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfoolsandroads/configs/Cfoolsandroads_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfoolsandroads/configs/Cfoolsandroads_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 10
