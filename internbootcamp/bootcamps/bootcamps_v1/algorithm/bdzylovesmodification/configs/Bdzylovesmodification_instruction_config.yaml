instruction_generators:
  config_1:
    config:
      n_range: [3, 5]
      m_range: [3, 5]
      k_range: [5, 20]
      p_range: [5, 20]
      a_min: 10
      a_max: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_range: [4, 5]
      m_range: [4, 5]
      k_range: [10, 20]
      p_range: [10, 30]
      a_min: 20
      a_max: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_range: [2, 4]
      m_range: [2, 4]
      k_range: [1, 10]
      p_range: [1, 10]
      a_min: 1
      a_max: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/bdzylovesmodification/configs/Bdzylovesmodification_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.bdzylovesmodification.Bdzylovesmodification_instruction_generator.BdzylovesmodificationInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
