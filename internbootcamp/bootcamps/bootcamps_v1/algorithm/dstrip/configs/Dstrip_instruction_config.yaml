      min_n: 10
      max_n: 20
      min_s: 5
      max_s: 30
      min_l: 3
      max_l: 7
      ensure_solvable: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dstrip/configs/Dstrip_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dstrip/configs/Dstrip_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dstrip.Dstrip_instruction_generator.DstripInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
