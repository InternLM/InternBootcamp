    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_guests: 1000
      min_lr: 0
      max_lr: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_guests: 2000
      min_lr: 500
      max_lr: 200000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_interaction_config.yaml
