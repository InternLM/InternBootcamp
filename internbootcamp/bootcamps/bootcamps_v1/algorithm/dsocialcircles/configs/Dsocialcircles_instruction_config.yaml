  config_4:
    config:
      max_guests: 4000
      min_lr: 10
      max_lr: 400000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dsocialcircles/configs/Dsocialcircles_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dsocialcircles.Dsocialcircles_instruction_generator.DsocialcirclesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
