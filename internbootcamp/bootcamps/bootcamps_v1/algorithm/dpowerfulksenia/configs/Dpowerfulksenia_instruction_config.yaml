instruction_generators:
  config_1:
    config:
      min_n: 4
      max_n: 4
      possible: False
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_n: 3
      max_n: 5
      possible: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 3
      max_n: 10
      possible: None
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      min_n: 5
      max_n: 7
      possible: True
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dpowerfulksenia/configs/Dpowerfulksenia_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dpowerfulksenia.Dpowerfulksenia_instruction_generator.DpowerfulkseniaInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
