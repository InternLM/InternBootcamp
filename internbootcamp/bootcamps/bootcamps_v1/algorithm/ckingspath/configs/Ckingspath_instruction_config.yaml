instruction_generators:
  config_1:
    config:
      max_coord: 200
      min_segments: 3
      max_segments: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ckingspath/configs/Ckingspath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ckingspath/configs/Ckingspath_interaction_config.yaml
    generation_ratio: 0.50
  config_2:
    config:
      max_coord: 100
      min_segments: 1
      max_segments: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ckingspath/configs/Ckingspath_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ckingspath/configs/Ckingspath_interaction_config.yaml
    generation_ratio: 0.50

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ckingspath.Ckingspath_instruction_generator.CkingspathInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
