    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 80
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/esergeyandsubway/configs/Esergeyandsubway_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.esergeyandsubway.Esergeyandsubway_instruction_generator.EsergeyandsubwayInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
