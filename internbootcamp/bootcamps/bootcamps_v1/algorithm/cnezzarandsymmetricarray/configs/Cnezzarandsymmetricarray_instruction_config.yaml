instruction_generators:
  config_1:
    config:
      case_type: valid
      min_n: 1
      max_n: 5
      value_range: [1, 1000000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      case_type: valid
      min_n: 4
      max_n: 7
      value_range: [1000, 100000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      case_type: mixed
      min_n: 2
      max_n: 4
      value_range: [100, 1000]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      case_type: invalid
      min_n: 2
      max_n: 6
      value_range: [1, 500]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cnezzarandsymmetricarray/configs/Cnezzarandsymmetricarray_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cnezzarandsymmetricarray.Cnezzarandsymmetricarray_instruction_generator.CnezzarandsymmetricarrayInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
