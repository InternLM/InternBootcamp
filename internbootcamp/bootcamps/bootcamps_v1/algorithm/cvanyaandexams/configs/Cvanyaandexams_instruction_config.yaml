    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_exams: 500
      max_r: 10000
      max_bi: 1000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_exams: 200
      max_r: 5000
      max_bi: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandexams/configs/Cvanyaandexams_interaction_config.yaml
