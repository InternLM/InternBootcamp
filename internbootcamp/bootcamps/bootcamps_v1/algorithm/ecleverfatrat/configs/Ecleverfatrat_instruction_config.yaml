instruction_generators:
  config_1:
    config:
      max_n: 3
      min_a: 1
      max_a: 50
      min_w: 1
      max_w: 100
      n_rows_strategy: fixed
      aGenerationStrategy: low
      wGenerationStrategy: high
      test_case_type: easy
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      max_n: 5
      min_a: 50
      max_a: 100
      min_w: 1
      max_w: 50
      n_rows_strategy: random
      aGenerationStrategy: high
      wGenerationStrategy: low
      test_case_type: hard
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      max_n: 2
      min_a: 1
      max_a: 10
      min_w: 1
      max_w: 10
      n_rows_strategy: fixed
      aGenerationStrategy: random
      wGenerationStrategy: random
      test_case_type: small
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ecleverfatrat/configs/Ecleverfatrat_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ecleverfatrat.Ecleverfatrat_instruction_generator.EcleverfatratInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
