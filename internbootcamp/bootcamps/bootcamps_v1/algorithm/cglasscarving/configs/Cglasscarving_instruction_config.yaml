instruction_generators:
  config_1:
    config:
      default_w: 3
      default_h: 2
      max_cuts: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      default_w: 5
      default_h: 5
      max_cuts: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      default_w: 4
      default_h: 3
      max_cuts: 4
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      default_w: 6
      default_h: 4
      max_cuts: 3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cglasscarving/configs/Cglasscarving_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cglasscarving.Cglasscarving_instruction_generator.CglasscarvingInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
