instruction_generators:
  config_1:
    config:
      s_min: 2
      s_max: 500
      t_min: 1
      t_max: 500
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      s_min: 500
      s_max: 1000
      t_min: 500
      t_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      s_min: 2
      s_max: 1000
      t_min: 1
      t_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      s_min: 100
      s_max: 500
      t_min: 100
      t_max: 500
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ctram/configs/Ctram_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ctram.Ctram_instruction_generator.CtramInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
