instruction_generators:
  config_1:
    config:
      n_min: 2
      n_max: 5
      min_val: -5
      max_val: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n_min: 2
      n_max: 10
      min_val: -100
      max_val: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n_min: 3
      n_max: 6
      min_val: -20
      max_val: 20
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n_min: 1
      n_max: 4
      min_val: 0
      max_val: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cfindpair/configs/Cfindpair_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cfindpair.Cfindpair_instruction_generator.CfindpairInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
