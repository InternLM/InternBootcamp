instruction_generators:
  config_1:
    config:
      n: 7
      m: 8
      volcanoes: [[1, 6], [2, 6], [3, 5], [3, 6], [4, 3], [5, 1], [5, 2], [5, 3]]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 4
      m: 2
      volcanoes: [[1, 3], [1, 4]]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 2
      m: 2
      volcanoes: [[1, 2], [2, 1]]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 6
      m: 3
      volcanoes: [[2, 2], [3, 3], [4, 4]]
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dvolcanoes/configs/Dvolcanoes_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.dvolcanoes.Dvolcanoes_instruction_generator.DvolcanoesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
