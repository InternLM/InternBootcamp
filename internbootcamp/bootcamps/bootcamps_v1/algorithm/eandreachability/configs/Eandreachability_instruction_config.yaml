    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 10
      max_q: 5
      max_val: 300000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 5
      max_q: 3
      max_val: 300000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eandreachability/configs/Eandreachability_interaction_config.yaml
