    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dmissionimpassable/configs/Dmissionimpassable_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dmissionimpassable/configs/Dmissionimpassable_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_length: 70
      a_positive_prob: 0.9
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dmissionimpassable/configs/Dmissionimpassable_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/dmissionimpassable/configs/Dmissionimpassable_interaction_config.yaml
