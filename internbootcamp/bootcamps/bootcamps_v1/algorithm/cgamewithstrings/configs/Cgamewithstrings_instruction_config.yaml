    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cgamewithstrings/configs/Cgamewithstrings_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cgamewithstrings/configs/Cgamewithstrings_interaction_config.yaml
