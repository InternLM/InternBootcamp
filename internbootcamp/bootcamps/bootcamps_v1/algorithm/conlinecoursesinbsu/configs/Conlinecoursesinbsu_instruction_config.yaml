    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/conlinecoursesinbsu/configs/Conlinecoursesinbsu_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_n: 5
