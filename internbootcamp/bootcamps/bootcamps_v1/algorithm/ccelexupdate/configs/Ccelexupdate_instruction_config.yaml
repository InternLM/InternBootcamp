      max_x: 200
      max_y: 200
      max_dx: 100
      max_dy: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccelexupdate/configs/Ccelexupdate_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/ccelexupdate/configs/Ccelexupdate_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.ccelexupdate.Ccelexupdate_instruction_generator.CcelexupdateInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
