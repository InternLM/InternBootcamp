instruction_generators:
  config_1:
    config:
      max_n: 50000
      min_n: 5000
      max_k: 256
      min_k: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      max_n: 100000
      min_n: 1
      max_k: 256
      min_k: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      max_n: 1000
      min_n: 100
      max_k: 200
      min_k: 10
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      max_n: 10000
      min_n: 1000
      max_k: 100
      min_k: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cposterized/configs/Cposterized_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cposterized.Cposterized_instruction_generator.CposterizedInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
