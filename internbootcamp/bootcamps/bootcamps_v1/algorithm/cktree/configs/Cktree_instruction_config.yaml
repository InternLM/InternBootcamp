instruction_generators:
  config_1:
    config:
      min_n: 1
      max_n: 80
      min_k: 5
      max_k: 30
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      min_n: 1
      max_n: 100
      min_k: 1
      max_k: 50
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 1
      max_n: 100
      min_k: 1
      max_k: 100
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      min_n: 1
      max_n: 80
      min_k: 1
      max_k: 30
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cktree/configs/Cktree_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cktree.Cktree_instruction_generator.CktreeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
