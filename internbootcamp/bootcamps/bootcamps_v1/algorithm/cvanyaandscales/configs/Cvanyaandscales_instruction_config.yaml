instruction_generators:
  config_1:
    config:
      w_min: 2
      w_max: 100
      m_min: 1
      m_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      w_min: 2
      w_max: 200
      m_min: 1
      m_max: 2000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      w_min: 2
      w_max: 1000
      m_min: 1
      m_max: 10000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      w_min: 2
      w_max: 1000000000
      m_min: 1
      m_max: 1000000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cvanyaandscales/configs/Cvanyaandscales_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cvanyaandscales.Cvanyaandscales_instruction_generator.CvanyaandscalesInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
