    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/csearchingforgraph/configs/Csearchingforgraph_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/csearchingforgraph/configs/Csearchingforgraph_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      min_n: 8
      max_n: 20
      max_t: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/csearchingforgraph/configs/Csearchingforgraph_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/csearchingforgraph/configs/Csearchingforgraph_interaction_config.yaml
