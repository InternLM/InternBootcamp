    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 1
      max_b: 0
      max_n: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 2
      max_b: 1
      max_n: 2
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 3
      max_b: 2
      max_n: 3
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/fboboniuandstring/configs/Fboboniuandstring_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.fboboniuandstring.Fboboniuandstring_instruction_generator.FboboniuandstringInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
