instruction_generators:
  config_1:
    config:
      n: 3
      max_digits: 5
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_interaction_config.yaml
    generation_ratio: 0.25
  config_2:
    config:
      n: 50
      max_digits: 25
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      n: 1
      max_digits: 1
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_interaction_config.yaml
    generation_ratio: 0.25
  config_4:
    config:
      n: 100
      max_digits: 25
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cyaroslavandalgorithm/configs/Cyaroslavandalgorithm_interaction_config.yaml
    generation_ratio: 0.25

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cyaroslavandalgorithm.Cyaroslavandalgorithm_instruction_generator.CyaroslavandalgorithmInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
