instruction_generators:
  config_1:
    config:
      n_range: [2, 15]
      m_range: [3, 20]
      h_max: 3000
      p_max: 20000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_range: [1, 20]
      m_range: [5, 25]
      h_max: 4000
      p_max: 25000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_range: [1, 10]
      m_range: [1, 10]
      h_max: 2000
      p_max: 15000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/creadtime/configs/Creadtime_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.creadtime.Creadtime_instruction_generator.CreadtimeInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
