instruction_generators:
  config_1:
    config:
      n_min: 16
      n_max: 20
      x_min: 16
      x_max: 20
      k_max: 1000000
      a_max: 100000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_interaction_config.yaml
    generation_ratio: 0.33
  config_2:
    config:
      n_min: 11
      n_max: 15
      x_min: 11
      x_max: 15
      k_max: 100000
      a_max: 10000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_interaction_config.yaml
    generation_ratio: 0.33
  config_3:
    config:
      n_min: 6
      n_max: 10
      x_min: 6
      x_max: 10
      k_max: 10000
      a_max: 1000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/cstablegroups/configs/Cstablegroups_interaction_config.yaml
    generation_ratio: 0.33

# 全局配置
global_config:
  # 指令生成器类的完整路径
  class_name: "internbootcamp.bootcamps.bootcamps_v1.algorithm.cstablegroups.Cstablegroups_instruction_generator.CstablegroupsInstructionGenerator"
  
  # 随机种子配置
  enable_random_seed: true
  default_seed: 999
  
  # 数据集划分配置
  default_split_samples:
    train: 1000
    test: 100
  
  # 是否启用数据打乱
  shuffle: true

  # 是否生成parquet文件
  gen_parquet: false
