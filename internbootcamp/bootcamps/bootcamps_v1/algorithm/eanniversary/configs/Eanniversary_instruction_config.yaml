    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eanniversary/configs/Eanniversary_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eanniversary/configs/Eanniversary_interaction_config.yaml
    generation_ratio: 0.25
  config_3:
    config:
      m: 1000000000
      l: 1000000000
      r: 1000000000000
      k: 1000000
    tool_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eanniversary/configs/Eanniversary_tool_config.yaml
    interaction_config_path: internbootcamp/bootcamps/bootcamps_v1/algorithm/eanniversary/configs/Eanniversary_interaction_config.yaml
